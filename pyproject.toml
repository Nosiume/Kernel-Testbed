[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel_testbed"
version = "0.1"
requires-python = ">=3.9"
dependencies = [
    "pwntools",
    "requests",
    "tqdm",
    "colorama",
    "beautifulsoup4",
    "subprocess"
]

[project.scripts]
kexp-env= "kernel_testbed.app:main"
